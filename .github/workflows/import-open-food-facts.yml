name: Import Open Food Facts

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:15 UTC, outside the application's busiest hours.
    - cron: "15 3 * * 0"

permissions:
  contents: read

concurrency:
  group: open-food-facts-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.OFF_IMPORT_DATABASE_URL }}
      OFF_MAX_PRODUCTS: "100000"
      OFF_STAPLE_QUOTA: "20000"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Importer les produits et prix
        run: pnpm db:import-open-food-facts
